name: Сборка Android

on:
  push:
    branches: [main]
    paths: ['app/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      api:
        description: 'Адрес сервера для приложения'
        required: false
        default: 'https://gmhockey.ru'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_API: ${{ github.event.inputs.api || 'https://gmhockey.ru' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Зависимости
        run: npm ci --no-audit --no-fund
      - name: Игра для приложения
        run: npm run www && npx cap sync android
      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_B64 не задан — собираю только отладочную версию"
          fi
      - name: Сборка
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app/android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then ./gradlew --no-daemon assembleRelease bundleRelease; else ./gradlew --no-daemon assembleDebug; fi
          mkdir -p ../../out
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../../out/genmanager-$VERSION_NAME.apk
            cp app/build/outputs/bundle/release/app-release.aab ../../out/genmanager-$VERSION_NAME.aab
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../../out/genmanager-$VERSION_NAME-debug.apk
          fi
          ls -la ../../out
      - uses: actions/upload-artifact@v4
        with:
          name: genmanager-${{ env.VERSION_NAME }}
          path: out/*
      - name: Выпуск на GitHub (ссылка для скачивания на телефон)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-$VERSION_NAME" out/* --title "Android $VERSION_NAME" \
            --notes "Сборка для Android. Сервер: $APP_API. APK — установить на телефон, AAB — загрузить в RuStore." --prerelease
