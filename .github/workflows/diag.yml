name: Диагностика доступа
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in gmhockey.ru www.gmhockey.ru 135-106-181-183.sslip.io; do
            echo "=== $h"; dig +short A $h; dig +short NS ${h#www.} | head -3
            curl -sS -o /dev/null -w "code %{http_code} time %{time_total}s ip %{remote_ip}\n" --max-time 20 https://$h/ || true
            curl -sS --max-time 20 https://$h/api/health || true; echo
            echo | openssl s_client -connect 135.106.181.183:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -dates 2>/dev/null || true
          done
          curl -sS -o /dev/null -w "vercel code %{http_code}\n" https://shaiba-potolok.vercel.app/ || true
