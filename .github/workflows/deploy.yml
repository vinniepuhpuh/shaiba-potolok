name: Обновление сервера

on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gm
          POSTGRES_PASSWORD: gm
          POSTGRES_DB: gm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gm" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://gm:gm@localhost:5432/gm_test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Обновить сервер
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "Секреты DEPLOY_HOST и DEPLOY_KEY не заданы — пропускаю обновление."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@"$HOST" deploy
