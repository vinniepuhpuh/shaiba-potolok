<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Генменеджер · админка</title>
<style>
:root{color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--ring:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#eb6834;--good:#006300;--bad:#c4332f;--wash:rgba(42,120,214,.08)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--ring:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--good:#0ca30c;--bad:#e66767;--wash:rgba(57,135,229,.12)}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1080px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:650}
.sub{color:var(--ink2);font-size:13px}
nav.tabs{display:flex;gap:4px;margin:10px 0 14px;flex-wrap:wrap}
nav.tabs button{font:inherit;font-size:13px;padding:7px 14px;border-radius:9px;border:1px solid var(--ring);background:var(--surface);color:var(--ink);cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--wash);border-color:var(--s1);color:var(--s1);font-weight:600}
button{font:inherit;font-size:13px;padding:6px 11px;border-radius:9px;border:1px solid var(--ring);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{background:var(--wash)}
button.pri{background:var(--s1);border-color:var(--s1);color:#fff}
button.danger{color:var(--bad);border-color:var(--bad)}
button.sm{font-size:12px;padding:4px 9px}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;font-size:13px;padding:7px 10px;border-radius:9px;border:1px solid var(--ring);background:var(--page);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;font-weight:650}
.card h2 small{color:var(--muted);font-weight:400;margin-left:8px}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:12px}
.tile small{display:block;color:var(--ink2);font-size:12px}
.tile b{display:block;font-size:26px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:500;white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.u{cursor:pointer}
tr.u:hover{background:var(--wash)}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--ring);color:var(--ink2)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
.badge.good{color:var(--good);border-color:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.err{color:var(--bad);font-size:13px}
.mut{color:var(--muted);font-size:12.5px}
.login{max-width:420px;margin:12vh auto}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
pre{font:12px/1.4 ui-monospace,Consolas,monospace;margin:0;white-space:pre-wrap;word-break:break-word}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.kv div small{display:block;color:var(--muted);font-size:11.5px}
.kv div b{font-size:15px}
details summary{cursor:pointer;color:var(--ink2);font-size:13px;margin:6px 0}
details[open] summary{margin-bottom:8px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU');
const hhmm=iso=>{try{const d=new Date(iso);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}catch(e){return String(iso||'');}};
const STN={active:'активен',finished:'завершён',archived:'в архиве'};
const K='gm-admin-tok';
let tok=null;try{tok=localStorage.getItem(K);}catch(e){}
let tab='dash', cache={};

async function api(path,opt){
  opt=opt||{};
  const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){logout('Сессия истекла — войдите заново.');throw new Error('401');}
  if(!r.ok){let j=null;try{j=await r.json();}catch(e){}throw new Error((j&&j.error)||('HTTP '+r.status));}
  return r.status===204?null:r.json();
}
const post=(path,body)=>api(path,{method:'POST',body:JSON.stringify(body||{})});
const del=(path)=>api(path,{method:'DELETE'});

function logout(msg){
  tok=null;try{localStorage.removeItem(K);}catch(e){}
  renderLogin(msg);
}
function renderLogin(msg){
  $('#app').innerHTML=`<div class="card login"><h1 style="font-size:17px">Генменеджер · админка</h1>
  <p class="sub">Введите ключ ADMIN_KEY. Сервер выдаст подписанную сессию на 12 часов — ключ в браузере не хранится.</p>
  <div class="row"><input id="k" type="password" autocomplete="off" placeholder="Ключ ADMIN_KEY" style="flex:1;min-width:200px"></div>
  ${msg?`<p class="err">${esc(msg)}</p>`:''}
  <button class="pri" id="go">Войти</button></div>`;
  const go=async()=>{
    $('#go').disabled=true;
    try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:$('#k').value.trim()})});
      if(r.status===429){renderLogin('Слишком много попыток — подождите минуту.');return;}
      if(!r.ok){renderLogin('Неверный ключ.');return;}
      tok=(await r.json()).token;try{localStorage.setItem(K,tok);}catch(e){}
      tab='dash';load();
    }catch(e){renderLogin('Нет связи с сервером.');}
  };
  $('#go').onclick=go;$('#k').onkeydown=e=>{if(e.key==='Enter')go();};$('#k').focus();
}

function shell(inner){
  $('#app').innerHTML=`<header><div><h1>Генменеджер · админка</h1><span class="sub">управление игроками и турнирами</span></div>
  <div><button id="lo">Выйти</button></div></header>
  <nav class="tabs">${[['dash','Дашборд'],['users','Участники'],['seasons','Турниры'],['log','Журнал']].map(([k,n])=>`<button data-t="${k}" ${tab===k?'aria-current="page"':''}>${n}</button>`).join('')}</nav>
  ${inner}`;
  $('#lo').onclick=()=>logout();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;cache={};load();});
}
function busy(msg){shell(`<div class="card"><p class="mut">${msg||'Загружаю…'}</p></div>`);}

async function load(){
  if(!tok)return renderLogin();
  busy();
  try{
    if(tab==='dash')return renderDash(await api('/api/admin/stats'));
    if(tab==='users')return renderUsers(await api('/api/admin/users?page='+(cache.page||1)+(cache.q?'&q='+encodeURIComponent(cache.q):'')));
    if(tab==='seasons')return renderSeasons(await api('/api/admin/seasons'));
    if(tab==='log')return renderLog(await api('/api/admin/log'));
  }catch(e){shell(`<div class="card"><p class="err">Ошибка: ${esc(e.message)}</p><button onclick="load()">Повторить</button></div>`);}
}

/* ---------- дашборд ---------- */
function renderDash(s){
  const last7=(s.daily||[]).slice(-7).reduce((a,d)=>a+(d.new||0),0);
  cache.dash=s;
  shell(`<div class="grid tiles">
    <div class="card tile"><small>Всего игроков</small><b>${fmt(s.users)}</b></div>
    <div class="card tile"><small>DAU</small><b>${fmt(s.dau)}</b></div>
    <div class="card tile"><small>WAU</small><b>${fmt(s.wau)}</b></div>
    <div class="card tile"><small>Новых за 7 дней</small><b>${fmt(s.new_week!=null?s.new_week:last7)}</b></div>
    <div class="card tile"><small>Матчей вчера</small><b>${fmt(s.gamesYesterday)}</b></div>
    <div class="card tile"><small>Сохранений</small><b>${fmt(s.saves)}</b></div>
  </div>
  <div class="card"><h2>Игроки по дням<small>30 дней, МСК</small></h2>
    <table><tr><th>День</th><th class="r">Играли</th><th class="r">Новые</th></tr>
    ${(s.daily||[]).slice().reverse().map(d=>`<tr><td>${d.day}</td><td class="r">${d.users}</td><td class="r">${d.new}</td></tr>`).join('')}</table>
  </div>
  <div class="card"><h2>Активные турниры</h2><div id="ds"></div></div>`);
  api('/api/admin/seasons').then(r=>{
    const el=$('#ds');if(!el)return;
    const act=(r.seasons||[]).filter(x=>x.status==='active');
    el.innerHTML=act.length?`<table><tr><th>#</th><th>Название</th><th class="r">Людей</th><th class="r">Ботов</th><th>День</th><th>Вход до</th></tr>
      ${act.map(x=>`<tr><td>${x.sid}</td><td>${esc(x.name)}</td><td class="r">${x.humans}</td><td class="r">${x.bots}</td><td>${x.day}</td><td class="mono">${hhmm(x.start)}</td></tr>`).join('')}</table>`
      :'<p class="mut">Активных турниров нет.</p>';
  }).catch(()=>{});
}

/* ---------- участники ---------- */
function renderUsers(r){
  const pages=Math.max(1,Math.ceil(r.total/r.per));
  shell(`<div class="card"><div class="row">
    <input id="q" placeholder="Имя, username или id" value="${esc(cache.q||'')}" style="flex:1;min-width:200px">
    <button id="qs">Найти</button>${cache.q?'<button id="qc">Сбросить</button>':''}</div>
  <table><tr><th>ID</th><th>Имя</th><th>Платформа</th><th>Зарегистрирован</th><th>Последний визит</th><th class="r">Сезонов</th><th></th></tr>
  ${r.users.map(u=>`<tr class="u" data-id="${u.id}"><td>${u.id}</td><td><b>${esc(u.first_name||'—')}</b>${u.username?' <span class="mut">@'+esc(u.username)+'</span>':''}${u.tg_id?'':' <span class="mut">(устройство)</span>'}</td>
    <td>${esc(u.platform||'tg')}</td><td class="mono">${hhmm(u.created_at)}</td><td class="mono">${hhmm(u.last_seen)}</td>
    <td class="r">${u.seasons}</td><td>${u.banned?'<span class="badge bad">бан</span>':''}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Никого не нашли.</td></tr>'}
  </table>
  <div class="pager"><button id="pv" ${r.page<=1?'disabled':''}>←</button><span class="mut">${r.page} / ${pages} · всего ${r.total}</span><button id="pn" ${r.page>=pages?'disabled':''}>→</button></div></div>
  <div id="ucard"></div>`);
  const search=()=>{cache.q=$('#q').value.trim()||null;cache.page=1;load();};
  $('#qs').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search();};
  if($('#qc'))$('#qc').onclick=()=>{cache.q=null;cache.page=1;load();};
  $('#pv').onclick=()=>{cache.page=Math.max(1,(cache.page||1)-1);load();};
  $('#pn').onclick=()=>{cache.page=(cache.page||1)+1;load();};
  document.querySelectorAll('tr.u').forEach(tr=>tr.onclick=()=>userCard(+tr.dataset.id));
}
async function userCard(id){
  const el=$('#ucard');if(!el)return;
  el.innerHTML='<div class="card"><p class="mut">Загружаю карточку…</p></div>';
  el.scrollIntoView({behavior:'smooth',block:'start'});
  let c;try{c=await api('/api/admin/users/'+id);}catch(e){el.innerHTML=`<div class="card"><p class="err">${esc(e.message)}</p></div>`;return;}
  const u=c.user;
  el.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between">
    <h2 style="margin:0">${esc(u.first_name||'—')} <small>id ${u.id}${u.username?' · @'+esc(u.username):''}${u.tg_id?'':' · устройство '+esc(u.platform||'')}</small></h2>
    ${u.banned?'<span class="badge bad">заблокирован'+(u.ban_reason?': '+esc(u.ban_reason):'')+'</span>':'<span class="badge good">активен</span>'}
  </div>
  <div class="kv">
    <div><small>Регистрация</small><b>${hhmm(u.created_at)}</b></div>
    <div><small>Последний визит</small><b>${hhmm(u.last_seen)}</b></div>
    <div><small>Очков рейтинга</small><b>${c.rating?fmt(c.rating.pts):'—'}</b></div>
    <div><small>Кошелёк</small><b>${fmt(c.wallet)}</b></div>
  </div>
  <p class="mut" style="margin:4px 0">Клубы в активных турнирах: ${c.clubs.length?c.clubs.map(x=>`«${esc(x.club)}» в <b>${esc(x.name)}</b> №${x.sid}${x.bot?' (у компьютера)':''}`).join('; '):'нет'}</p>
  <div class="row">
    ${u.banned
      ?`<button class="sm" id="unban">Разблокировать</button>`
      :`<button class="sm danger" id="ban">Заблокировать</button>`}
    <button class="sm" id="ren">Сменить имя</button>
    <button class="sm" id="wal">Кошелёк: выдать/списать</button>
    <button class="sm danger" id="del">Удалить аккаунт</button>
  </div>
  <details><summary>История сезонов (${c.results.length}) · операции кошелька (${c.walletOps.length}) · последние события (${c.events.length})</summary>
    ${c.results.length?`<table><tr><th>Сезон</th><th>Клуб</th><th class="r">Место</th><th class="r">Очки</th></tr>${c.results.map(x=>`<tr><td>#${x.season_id} ${esc(x.season)}</td><td>${esc(x.club)}</td><td class="r">${x.place}</td><td class="r">${x.test?'тест':x.points}</td></tr>`).join('')}</table>`:'<p class="mut">Сезонов нет.</p>'}
    ${c.walletOps.length?`<table><tr><th>Время</th><th class="r">Δ</th><th>Комментарий</th></tr>${c.walletOps.map(o=>`<tr><td class="mono">${hhmm(o.created_at)}</td><td class="r">${o.delta>0?'+':''}${o.delta}</td><td>${esc(o.comment||'—')}</td></tr>`).join('')}</table>`:''}
    ${c.events.length?`<table><tr><th>Время</th><th>Событие</th></tr>${c.events.map(e=>`<tr><td class="mono">${hhmm(e.ts)}</td><td>${esc(e.type)}</td></tr>`).join('')}</table>`:''}
  </details></div>`;
  $('#ucard #ban').onclick=async()=>{
    const reason=prompt('Причина блокировки (увидит игрок):');if(reason==null)return;
    try{await post(`/api/admin/users/${id}/ban`,{banned:true,reason});userCard(id);}catch(e){alert(e.message);}
  };
  $('#ucard #unban').onclick=async()=>{try{await post(`/api/admin/users/${id}/ban`,{banned:false});userCard(id);}catch(e){alert(e.message);}};
  $('#ucard #ren').onclick=async()=>{
    const name=prompt('Новое отображаемое имя:',u.first_name||'');if(!name)return;
    try{await post(`/api/admin/users/${id}/rename`,{name});userCard(id);}catch(e){alert(e.message);}
  };
  $('#ucard #wal').onclick=async()=>{
    const d=prompt('Сумма: положительная — выдать, отрицательная — списать. Например: 500 или -200:');if(d==null)return;
    const delta=Math.round(Number(d));
    if(!Number.isFinite(delta)||delta===0)return alert('Введите число, не ноль.');
    const comment=prompt('Комментарий к операции:')||'';
    try{await post(`/api/admin/users/${id}/wallet`,{delta,comment});userCard(id);}catch(e){alert(e.message);}
  };
  $('#ucard #del').onclick=async()=>{
    if(!confirm(`Удалить аккаунт ${id} (${u.first_name||'—'})?\nКлубы в активных турнирах уйдут компьютеру, привязки и сохранения будут стёрты, имя в итогах сменится на «Удалённый аккаунт». Действие необратимо.`))return;
    try{const r=await post(`/api/admin/users/${id}/delete`);alert('Удалён. Клубов у компьютера: '+r.clubs);cache={};load();}catch(e){alert(e.message);}
  };
}

/* ---------- турниры ---------- */
function renderSeasons(r){
  cache.seasons=r.seasons||[];
  shell(`<div class="card"><h2>Создать турнир</h2><div class="row">
    <select id="ct"><option value="test8">Тестовый: 8 клубов</option><option value="big">Большая лига: 32 клуба</option></select>
    <input id="cn" placeholder="Название" style="flex:1;min-width:160px">
    <input id="cs" type="date" title="Дата старта (пусто — завтра)">
    <label class="mut"><input id="ctest" type="checkbox" checked> тестовый</label>
    <input id="cf" type="number" min="1" max="3600" placeholder="fastSec (тест)" style="width:120px">
    <button class="pri" id="cgo">Создать</button></div>
  <p class="mut">Быстрый тест: fastSec — секунд между слотами. Обычный сезон: слоты по вечерам с даты старта.</p></div>
  <div class="card"><h2>Все турниры<small>${cache.seasons.length}</small></h2>
  <table><tr><th>#</th><th>Название</th><th>Статус</th><th class="r">Люди/боты</th><th class="r">Клубов</th><th>День</th><th>Чемпион</th><th>Действия</th></tr>
  ${cache.seasons.map(s=>`<tr><td>${s.sid}</td>
    <td><b>${esc(s.name)}</b>${s.test?' <span class="badge">тест</span>':''}${s.big?' <span class="badge">big</span>':''}</td>
    <td><span class="badge ${s.status==='active'?'good':''}">${STN[s.status]||s.status}</span></td>
    <td class="r">${s.humans} / ${s.bots}</td><td class="r">${s.clubs}</td><td>${s.day}</td>
    <td>${s.champName?esc(s.champName):(s.champ!=null?'№'+s.champ:'—')}</td>
    <td class="row" style="margin:0">
      ${s.status==='active'?`<button class="sm" data-a="tick" data-id="${s.sid}">Тик</button><button class="sm" data-a="finish" data-id="${s.sid}">Завершить</button>`:''}
      <button class="sm" data-a="kick" data-id="${s.sid}" ${s.status!=='active'?'disabled':''}>Снять игрока</button>
      <button class="sm" data-a="give" data-id="${s.sid}" ${s.status!=='active'?'disabled':''}>Отдать клуб</button>
      <button class="sm" data-a="archive" data-id="${s.sid}" ${s.status==='archived'?'disabled':''}>Архив</button>
      <button class="sm danger" data-a="del" data-id="${s.sid}">Удалить</button>
    </td></tr>`).join('')||'<tr><td colspan="8" class="mut">Турниров нет.</td></tr>'}
  </table></div>`);
  $('#cgo').onclick=async()=>{
    const body={template:$('#ct').value,name:$('#cn').value.trim(),test:$('#ctest').checked};
    if($('#cs').value)body.start=$('#cs').value;
    if($('#cf').value)body.fastSec=+$('#cf').value;
    try{const r=await post('/api/admin/seasons',body);alert('Создан сезон №'+r.id+': слотов '+r.slots+', первый матч '+new Date(r.first).toLocaleString('ru-RU'));cache={};load();}
    catch(e){alert(e.message);}
  };
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>seasonAct(b.dataset.a,+b.dataset.id));
}
async function seasonAct(act,sid){
  try{
    if(act==='tick'){await post(`/api/admin/seasons/${sid}/tick`);alert('Тик выполнен');}
    else if(act==='finish'){if(!confirm('Досрочно завершить сезон №'+sid+'? Чемпион — лидер текущей таблицы.'))return;await post(`/api/admin/seasons/${sid}/finish`);}
    else if(act==='archive'){if(!confirm('Архивировать сезон №'+sid+'? Из просмотра он исчезнет.'))return;await post(`/api/admin/seasons/${sid}/archive`);}
    else if(act==='del'){if(!confirm('Удалить сезон №'+sid+'? Можно удалить только не начавшийся и пустой.'))return;await del(`/api/admin/seasons/${sid}`);}
    else if(act==='kick'){const team=prompt('Номер клуба (0-based) в сезоне:');if(team==null)return;
      await post(`/api/admin/seasons/${sid}/human`,{team:+team});}
    else if(act==='give'){const team=prompt('Номер клуба (0-based) в сезоне:');if(team==null)return;
      const uid=prompt('ID игрока (из раздела «Участники»):');if(uid==null)return;
      await post(`/api/admin/seasons/${sid}/human`,{team:+team,uid:+uid});}
    cache={};load();
  }catch(e){alert(e.message);}
}

/* ---------- журнал ---------- */
function renderLog(r){
  shell(`<div class="card"><h2>Последние ${r.log.length} действий</h2>
  <table><tr><th>Время</th><th>Действие</th><th>Цель</th><th>Payload</th></tr>
  ${r.log.map(x=>`<tr><td class="mono">${hhmm(x.created_at)}</td><td><b>${esc(x.action)}</b></td><td>${esc(x.target||'—')}</td><td><pre>${esc(JSON.stringify(x.payload))}</pre></td></tr>`).join('')||'<tr><td colspan="4" class="mut">Пока пусто.</td></tr>'}
  </table></div>`);
}

if(tok)load();else renderLogin();
</script>
