<style>:root{--st:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));--sb:max(env(safe-area-inset-bottom,0px),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)))}
:root{padding-top:var(--st);padding-bottom:var(--sb)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}.feed li.post div{color:var(--warn)}

.gpop{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(96px + var(--st));max-width:528px;margin:0 auto;z-index:4;background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px #0007;border:2px solid var(--red);display:flex;flex-direction:column;gap:4px;pointer-events:none}
.gpop.on{animation:gpin .35s cubic-bezier(.2,1.4,.4,1)}
.gp-h{display:flex;align-items:center;gap:10px}
.gp-t{flex:1;min-width:0}
.gp-t b{display:block;font:800 22px/1 var(--fd);color:var(--red);letter-spacing:.02em}
.gp-t small{color:var(--muted);font-size:12.5px}
.gp-sc{font:600 26px var(--fm)}
.gp-n{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.gp-num{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:6px;background:var(--ink);color:var(--surface);font:700 14px var(--fm);padding:0 4px}
@keyframes gpin{from{transform:translateY(-14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.mv{position:fixed}

.wn{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.wn-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wn-h b{font:800 15px var(--fd)}
.wn-h small{color:var(--muted);font:500 12px var(--fm)}
.wn ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pick-hero .hero-sub{margin-top:4px;color:var(--board-ink);font:600 13px var(--fb);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.pos i{font-style:normal;font-size:9px;opacity:.7;letter-spacing:0}
.stys{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin:10px 0}
.sty{border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:8px 9px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);font:inherit;cursor:pointer}
.sty b{font-size:13.5px}.sty small{font-size:11.5px;color:var(--muted)}.sty i{font-style:normal;font-size:11px;line-height:1.25}
.sty.on{background:var(--surface);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.seg.five button{font-size:11.5px;padding:8px 1px}
.tgl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.tgl-row .seg{flex:0 0 auto}.tgl-row .seg button{padding:6px 12px}
</style>
<style>
/* Layout: one-column phone app. Scoreboard header on top, scrolling content, tab bar pinned to the bottom. */
:root{
  --bg:#e8eef3;--surface:#ffffff;--sunk:#f1f5f9;--ink:#0e1c2b;--muted:#5a6b7d;--line:#d3dde6;
  --red:#c81d34;--on-red:#ffffff;--blue:#1d4ed0;--good:#12804b;--warn:#a46000;
  --board:#0e1c2b;--board-ink:#eaf2f9;--board-mute:#93a8bc;
  --heat:rgba(29,78,208,.14);--gold:#c08a12;--silver:#7f8c9b;--bronze:#a8612f;
  --fd:"Unbounded","Arial Black",system-ui,sans-serif;
  --fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b131c;--surface:#131f2c;--sunk:#0f1923;--ink:#e4ecf4;--muted:#8d9fb2;--line:#233347;
  --red:#ff5d70;--on-red:#1c0408;--blue:#7b9cff;--good:#43c584;--warn:#e9a63d;
  --board:#060c13;--board-ink:#eaf2f9;--board-mute:#8295a8;--heat:rgba(123,156,255,.22);--gold:#e2b544;--silver:#aab6c4;--bronze:#d08b5c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b131c;--surface:#131f2c;--sunk:#0f1923;--ink:#e4ecf4;--muted:#8d9fb2;--line:#233347;
  --red:#ff5d70;--on-red:#1c0408;--blue:#7b9cff;--good:#43c584;--warn:#e9a63d;
  --board:#060c13;--board-ink:#eaf2f9;--board-mute:#8295a8;--heat:rgba(123,156,255,.22);--gold:#e2b544;--silver:#aab6c4;--bronze:#d08b5c;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--st);z-index:10;background:var(--board)}
#app{max-width:560px;margin:0 auto;min-height:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.top{position:sticky;top:var(--st);z-index:5;background:var(--board);color:var(--board-ink);padding-block:10px 12px}
.top-row{display:flex;align-items:center;gap:10px}
.top-name{flex:1;min-width:0}
.top-name h1{font:800 15px/1.15 var(--fd);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-name small{display:block;color:var(--board-mute);font:500 12px var(--fm);margin-top:3px}
.icon-btn{background:none;border:1px solid #ffffff2e;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--board-ink)}
.cap{margin-top:10px}
.cap-bar{height:8px;border-radius:4px;background:#ffffff1f;overflow:hidden;display:flex}
.cap-bar i{display:block;height:100%}
.cap-lbl{display:flex;justify-content:space-between;font:500 11.5px var(--fm);color:var(--board-mute);margin-top:5px;gap:8px;flex-wrap:wrap}
.cap-lbl b{color:var(--board-ink);font-weight:600}

main{padding-block:14px 104px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font:600 12px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card h2 span{text-transform:none;letter-spacing:0;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.hl{border-color:var(--red)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.btn.sm{padding:8px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 auto}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0000001f}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.match .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.match .side b{font:600 13px var(--fd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.match .vs{font:600 12px var(--fm);color:var(--muted)}
.rt{font:600 12px var(--fm);color:var(--muted)}
.results{display:flex;gap:5px;flex-wrap:wrap}
.res{font:600 11.5px var(--fm);padding:4px 6px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.res.w{border-color:var(--good);color:var(--good)}
.res.l{border-color:var(--red);color:var(--red)}

.list{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:34px 1fr auto 76px;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);background:none;padding:9px 0;text-align:left;width:100%}
.list > .prow:first-child,.list > .grp + .prow{border-top:0}
.pn{min-width:0}
.pn b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn small,.money small{display:block;color:var(--muted);font-size:12px}
.money{text-align:right}
.money b{font:600 13px var(--fm)}
.pos{font:600 11px var(--fm);border:1px solid var(--line);border-radius:6px;padding:4px 0;text-align:center;color:var(--muted);background:var(--sunk)}
.pos.D{color:var(--blue)}
.pos.G{color:var(--red)}
.ovr{font:600 14px var(--fm);min-width:36px;text-align:center;border-radius:8px;padding:4px 6px;border:1px solid var(--line)}
.ovr.t5{background:var(--red);border-color:var(--red);color:var(--on-red)}
.ovr.t4{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.ovr.t3{border-color:var(--ink)}
.ovr.t1{color:var(--muted)}
.prow.sel{background:var(--sunk);box-shadow:inset 3px 0 0 var(--red)}
.prow .tick{width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:13px}
.prow.sel .tick{background:var(--red);border-color:var(--red);color:var(--on-red)}
.grp{font:600 11.5px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 0 2px;display:flex;justify-content:space-between}
.flag{display:inline-block;font:600 10px var(--fm);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px;color:var(--muted)}
.flag.exp{color:var(--warn);border-color:var(--warn)}

.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.meter small{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;gap:6px}
.meter small b{font:600 13px var(--fm);color:var(--ink)}
.bar{height:6px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.red i{background:var(--red)}
.bar.good i{background:var(--good)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv div{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:11.5px}
.kv b{font:600 15px var(--fm)}

.tbl-wrap{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 5px;border-bottom:1px solid var(--line)}
td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:left;color:var(--muted);width:22px}
td.tm{font-family:var(--fb);white-space:nowrap}
td.tm span{display:inline-flex;align-items:center;gap:7px}
tr.me td{background:var(--sunk);font-weight:600}
tr.cut td{border-bottom:2px solid var(--red)}
.pts{font-weight:600;color:var(--ink)}
.pl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.pl b{font:600 14px var(--fm);text-align:right}
.pl .neg{color:var(--red)}
.pl .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}

.news{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.news li{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px}
.news li span{font:500 11.5px var(--fm);color:var(--muted);padding-top:2px}

.pick-hero{background:var(--board);color:var(--board-ink);padding-block:22px}
.pick-hero h1{font:800 26px/1.1 var(--fd);letter-spacing:-.01em}
.pick-hero p{color:var(--board-mute);margin-top:10px;max-width:46ch}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tcard{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tcard div{min-width:0}
.tcard b{display:block;font:600 13px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard small{display:block;color:var(--muted);font-size:12px}
.divh{font:600 11.5px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}

/* lines */
.lineh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lineh b{font:800 13px var(--fd)}
.lineh span{font:600 13px var(--fm)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slots.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.slot small{font:600 10.5px var(--fm);color:var(--muted)}
.slot b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot span{font:600 13px var(--fm)}
.slot.empty b{color:var(--muted)}
.slot.cur{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--red)}
.tabs svg{width:22px;height:22px}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red)}

.veil{position:fixed;inset:0;background:#06101acc;z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding-block:8px calc(18px + var(--sb));animation:up .2s ease}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{font:800 20px/1.15 var(--fd)}
.sheet .sub{color:var(--muted);margin-top:4px;font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.big-ovr{font:600 30px var(--fm);line-height:1}
.stepper{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:6px;align-items:center}
.stepper output{text-align:center;font:600 20px var(--fm)}
.stepper .btn{padding:9px 11px}
.yrs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.yrs button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 0;font:600 14px var(--fm)}
.yrs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chance{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chance b{font:600 20px var(--fm)}
.warn{color:var(--warn);font-size:13.5px}
.bad{color:var(--red)}
.ok{color:var(--good)}
.factors{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px}
.factors b{font:600 13px var(--fm);text-align:right}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--blue)}
.upg{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.upg:first-of-type{border-top:0;padding-top:0}
.upg b{font-weight:600}
.upg small{color:var(--muted);font-size:12.5px;grid-column:1}
.offer{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.offer-h{display:flex;gap:10px;align-items:center}
.offer-h div{min-width:0}
.offer-h b{display:block;font:600 13px var(--fd)}
.offer-h small{color:var(--muted);font-size:12px}
.offer p{font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--sb));z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 6px 20px #0000003a;animation:up .2s ease}
.interest{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--red),var(--warn) 50%,var(--good));position:relative;margin:2px 0}
.interest i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
select{font:600 14px var(--fb);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.bracket{display:flex;flex-direction:column;gap:12px}
.ser{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font-size:13.5px}
.ser .win{font-weight:700}
.ser .lose{color:var(--muted)}
.ser .sc{font-family:var(--fm);text-align:right}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps span{font:600 10.5px var(--fb);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:3px solid var(--line);padding-top:5px}
.steps span.on{color:var(--red);border-color:var(--red)}
.steps span.done{color:var(--ink);border-color:var(--ink)}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pn small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%;accent-color:var(--red);margin:4px 0}
.tac-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.combo{font:600 11.5px var(--fb);color:var(--muted)}
.combo.l2{color:var(--good)}
.combo.l1{color:var(--blue)}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.filters select{padding:8px;font-size:13.5px}
.prow.pk .ovr{font-size:12.5px}
.seg.four button{font-size:12.5px;padding:8px 2px}
.odds{font:600 12px var(--fm);color:var(--muted)}
.role{font-weight:600}

.mv{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.mv-board{background:var(--board);color:var(--board-ink);padding-block:calc(10px + var(--st)) 10px;position:sticky;top:0;z-index:2}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.sb-t{display:flex;align-items:center;gap:8px;font:800 15px var(--fd)}
.sb-t.r{justify-content:flex-end}
.sb-sc{font:600 34px var(--fm);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.sb-sc i{font-style:normal;color:var(--board-mute)}
.sb-sub{text-align:center;font:500 12.5px var(--fm);color:var(--board-mute);margin-top:4px}
.mv-body{max-width:560px;margin:0 auto;padding-block:12px calc(30px + var(--sb));display:flex;flex-direction:column;gap:12px}
.rink{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#f3f8fc}
.rink-svg{display:block;width:100%;height:auto}
.rink-svg .dot{transition:transform var(--tt,1300ms) ease-in-out,opacity .3s}
.flash{opacity:0}
.flash.on{animation:flash 1.4s ease}
@keyframes flash{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
.mv-ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:340px;overflow-y:auto}
.feed li{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:13.5px}
.feed li span{font:500 11.5px var(--fm);color:var(--muted);padding-top:2px}
.feed li.goal div{font-weight:600}
.feed li.per div{color:var(--muted);font-style:italic}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;padding-block:4px}
.cmp b{font:600 14px var(--fm)}
.cmp span{text-align:center;font-size:12.5px;color:var(--muted)}
.cmpbar{grid-column:1/-1;display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--sunk);gap:2px}
.cmpbar i:first-child{background:var(--blue)}
.cmpbar i:last-child{background:var(--warn)}
.cmp-h{display:flex;justify-content:space-between;font:800 13px var(--fd)}
.bx-head{display:flex;align-items:center;justify-content:center;gap:16px;text-align:center}
.bx-head b{font:600 32px var(--fm);display:block}
.bx-head small{color:var(--muted);font-size:12.5px}
table.bx td,table.bx th{padding:5px 6px}
table.bx th:first-child,table.bx td:first-child{width:auto;color:var(--ink)}
table.bx.pl td.tm{font-size:13px}
table.lt th:first-child,table.lt td:first-child{width:28px}
.md{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font:700 11px var(--fm);color:#fff}
.md.m1{background:var(--gold)}.md.m2{background:var(--silver)}.md.m3{background:var(--bronze)}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid;margin-right:6px;vertical-align:-1px}
td.ok{color:var(--good)}td.bad{color:var(--red)}
.lg{object-fit:contain;flex:none;vertical-align:middle;display:inline-block}
.lnk{border:0;background:none;padding:0;font-weight:600;text-decoration:underline;color:inherit}
.flag.bad{color:var(--red);border-color:var(--red)}
.flag.ok{color:var(--good);border-color:var(--good)}
.pn small .lg{margin-right:2px;vertical-align:-3px}
.res .lg{vertical-align:-4px;margin-left:2px}
.pips.wide{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pips.wide i{width:auto;height:7px}
.yrs.y7{grid-template-columns:repeat(7,1fr)}
.yrs.y8{grid-template-columns:repeat(8,1fr)}
.yrs.y7 button,.yrs.y8 button{font-size:13px;padding:9px 0}
.chart{display:block;width:100%;height:auto}
.chart .ch-in,.legend .ch-in{fill:var(--good);background:var(--good)}
.chart .ch-ex,.legend .ch-ex{fill:var(--red);background:var(--red);opacity:.85}
.chart .ch-po{fill:var(--warn);opacity:.1}
.chart .ch-ax{stroke:var(--line);stroke-width:1}
.chart .ch-line{fill:none;stroke:var(--blue);stroke-width:2}
.chart .ch-dot{fill:var(--blue)}
.chart .ch-t{fill:var(--muted);font:500 9px var(--fm)}
.chart .ch-t.b{fill:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.ch-l{background:var(--blue);height:3px;vertical-align:3px}
.legend i.ch-p{background:var(--warn);opacity:.35}
.sp{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.sp.empty{border-style:dashed;background:transparent}
.sp-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sp-o{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.sp-o div{min-width:0}
.sp-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sp-r b{font:600 14px var(--fm)}
.sp-r small{color:var(--muted);font-size:12px}
.chip-s{display:inline-block;font:600 11px var(--fb);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
table.bx{table-layout:auto}
table.bx th,table.bx td{text-align:center;padding:6px 5px}
table.bx th:first-child,table.bx td:first-child{text-align:left;width:auto;color:var(--ink)}
table.bx.pl th:first-child{width:46%}
.bx-head .lg,.cmp-h .lg{display:block}
.cmp-h{align-items:center;gap:8px}
.cmp-h span{text-align:center}
.sb-t .lg{filter:drop-shadow(0 1px 2px #0006)}
.tcard .lg{flex:none}
.match .side .lg{filter:drop-shadow(0 2px 4px #0003)}

.flg{display:inline-block;vertical-align:-2px;border-radius:2px;box-shadow:0 0 0 .5px #0005;flex:none}

.tour{position:fixed;inset:0;z-index:40}
.tour-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(6,14,22,.74);transition:all .25s ease;pointer-events:none}
.tour-card{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:520px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px #0008;transition:top .25s ease}
.tour-card h3{font:800 17px/1.2 var(--fd)}
.tour-card p{font-size:14.5px;line-height:1.5}
.tour-card small{font:500 11.5px var(--fm)}
.tour-dots{display:flex;gap:4px}
.tour-dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.tour-dots i.done{background:var(--ink)}
.tour-dots i.on{background:var(--red)}
.hintc{background:var(--sunk);border-style:dashed}
.hint-h{display:flex;align-items:center;gap:8px}
.hint-i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--surface);font:700 13px var(--fm);flex:none}
.hintc .btn{align-self:flex-start}
.gloss{display:flex;flex-direction:column;gap:10px}
.gloss div{border-top:1px solid var(--line);padding-top:8px}
.gloss b{font-weight:600}
@media (prefers-reduced-motion:reduce){.tour-hole,.tour-card{transition:none}}

.tmb{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:7px;font:inherit;color:inherit;text-align:left;white-space:nowrap}
.tmb:hover{text-decoration:underline}
.tcard.mine{border-color:var(--red)}
.nt-i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:700 11px var(--fm);font-style:normal;margin-right:6px;vertical-align:1px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.nt-tr .nt-i{color:var(--blue);border-color:var(--blue)}
.nt-inj .nt-i{color:var(--red);border-color:var(--red)}
.nt-club .nt-i{color:var(--good);border-color:var(--good)}
.news li.me div{font-weight:600}
.backb{align-self:flex-start}
</style>
</head>

  const X=liveX(L),R_=L.R,ot=L.per===4,M={get:P};
  for(const k of [0,1]){if(!L.shift[k]||L.shift[k].left<=0)L.shift[k]={f:wIdx(FW_LW),d:wIdx(D_LW),left:ot?1:2};L.shift[k].left--;}
  for(const k of [0,1]){
    if(L.pen[k].length<2&&R()<R_.pen[k]*(ot?.5:1)){
      const ice=onIce(L,X,k);if(!ice.length)continue;
      const pid=wPickId(ice,Object.fromEntries(ice.map(i=>[i,{w:X[k].w[i].df?1.4:1}])),'w');
      L.pen[k].push({left:6,pid});lstat(L,pid,k).pim+=2;L.pim[k]+=2;L.ppo[1-k]++;
      evAdd(L,'pen',k,`${nm(M.get(pid))}: удаление на 2 минуты`);
    }
  }
  const n=[L.pen[0].length,L.pen[1].length],ice=[onIce(L,X,0),onIce(L,X,1)],sr=[0,0];
  const left=REG-L.tick,pull=[0,1].map(k=>{const d=L.sc[1-k]-L.sc[k];return !ot&&L.per===3&&left>0&&left<=6&&d>=1&&d<=2&&n[k]<=n[1-k]&&pullOn(k?L.a:L.h);});
  if(!L.pulled)L.pulled=[false,false];
  for(const k of [0,1]){if(pull[k]&&!L.pulled[k])evAdd(L,'gen',k,'Вратарь уехал на скамейку: шестой полевой');L.pulled[k]=pull[k];}
  let shot=null,goal=null,post=null;
  for(const k of [0,1]){
    if(L.done)break;
    let s,g,pp=false;
    if(n[k]<n[1-k]){pp=true;s=.45;g=R_.q[k];}
    else if(n[k]>n[1-k]){s=.04;g=.004;}
    else{const lm=X[k].lm[L.shift[k].f]||1;s=R_.s[k]*lm;g=R_.g[k]*lm;if(ot){s*=2.2;g*=2.2;}}
    if(pull[k]){s*=1.5;g*=1.8;}
    const en=pull[1-k];if(en)s=Math.max(s,.1);
    sr[k]=s;
    if(!ice[k].length||R()>=s)continue;
    const sid=wPickId(ice[k],X[k].w,'wg');shot=k;
    lstat(L,sid,k).sh++;L.psh[L.per-1][k]++;if(!en)L.gk[1-k].sa++;
    if(R()<(en?.5:g/s)){
      goal=k;L.sc[k]++;L.pg[L.per-1][k]++;if(!en)L.gk[1-k].ga++;
      const st=lstat(L,sid,k);st.g++;if(pp){st.ppg++;L.ppg[k]++;}
      const as=[];
      if(R()<.88){const a1=wPickId(ice[k],X[k].w,'wa',sid);if(a1){lstat(L,a1,k).a++;as.push(a1);if(R()<.62){const rest=ice[k].filter(i=>i!==a1);const a2=wPickId(rest,X[k].w,'wa',sid);if(a2){lstat(L,a2,k).a++;as.push(a2);}}}}
      if(!pp&&n[k]===n[1-k]){ice[k].forEach(i=>lstat(L,i,k).pm++);ice[1-k].forEach(i=>lstat(L,i,1-k).pm--);}
      if(pp)L.pen[1-k].shift();
      L.lg={k,sid,as:as.slice(),pp,sh:!pp&&n[k]>n[1-k],per:L.per,sc:L.sc.slice()};
      evAdd(L,'goal',k,`Гол! ${nm(M.get(sid))}${as.length?` (${as.map(i=>M.get(i).l).join(', ')})`:''}${pp?', в большинстве':n[k]>n[1-k]?', в меньшинстве':''}${en?', в пустые ворота':''} · ${L.sc[0]}:${L.sc[1]}`);
      L.lg.s=L.ev[L.ev.length-1].s;
      if(ot){L.done=true;L.ot=true;}
    }else if(R()<.035){
      post=k;lstat(L,sid,k).sh--;L.psh[L.per-1][k]--;if(!en)L.gk[1-k].sa--;
      evAdd(L,'post',k,`Штанга! Бросал ${nm(M.get(sid))}`);
    }
  }
  for(const k of [0,1]){L.pen[k].forEach(p=>p.left--);L.pen[k]=L.pen[k].filter(p=>p.left>0);ice[k].forEach(i=>lstat(L,i,k).toi++);}
  const poss=shot!=null?shot:(R()<sr[0]/(sr[0]+sr[1]||1)?0:1);
  const zone=shot!=null?'off':R()<.42?'off':R()<.55?'neu':'def';
  if(zone==='off')L.zt[poss]++;
  L.vis={poss,zone,shot,goal,post,ice:[ice[0].slice(),ice[1].slice()]};
  L.tick++;
  if(L.done)return endLive(L);
  if(!ot&&L.tick%TPP===0){
    if(L.tick<REG){L.tick--;evAdd(L,'per',null,`Конец ${L.per}-го периода · ${L.sc[0]}:${L.sc[1]}`);L.tick++;L.per++;L.pause='int';}
    else if(L.sc[0]===L.sc[1]){L.per=4;L.ot=true;L.pause='int';evAdd(L,'per',null,`Основное время: ${L.sc[0]}:${L.sc[1]}. Овертайм 3 на 3`);}
    else endLive(L);
  }else if(ot&&L.tick>=REG+OTT){
    const w=R()<1/(1+Math.exp(-R_.diff*.06))?0:1;L.sc[w]++;L.so=true;L.per=5;
    evAdd(L,'so',w,`Буллиты: победа ${T(w?L.a:L.h).name} · ${L.sc[0]}:${L.sc[1]}`);endLive(L);
  }
}
function endLive(L){L.done=true;L.pause=null;if(L.per<4)L.per=3;}
function runLive(L,stopAt){
  let g=0;
  while(!L.done&&g++<400){
    if(L.pause){if(stopAt&&L.tick>=stopAt)return;L.pause=null;prep(L);}
    stepTick(L);
    if(stopAt&&L.tick>=stopAt&&!L.done)return;
  }
}
function finishLive(L){

  const res={h:L.h,a:L.a,gh:L.sc[0],ga:L.sc[1],ot:L.ot||L.so,sh:L.tac[0],sa:L.tac[1],ph:L.ppg[0],pa:L.ppg[1],nh:L.pim[0]/2,na:L.pim[1]/2,yh:L.sty?L.sty[0]:'BAL',ya:L.sty?L.sty[1]:'BAL'};
  const win=L.sc[0]>L.sc[1]?0:1;
  if(stats){
    [0,1].forEach(k=>{const t=T(tm[k]);t.pim+=L.pim[k];t.ppo+=L.ppo[k];t.ppg+=L.ppg[k];t.pko+=L.ppo[1-k];t.ppga+=L.ppg[1-k];});
    for(const id in L.ps){const p=M.get(+id),s=L.ps[id];if(!p)continue;p.gp++;p.g+=s.g;p.a+=s.a;p.ppg+=s.ppg;p.pim+=s.pim;}
    [0,1].forEach(k=>{const g=M.get(X[k].g);if(!g)return;const sa=L.gk[k].sa,ga=L.gk[k].ga;g.gp++;g.gsa+=sa;g.gga+=ga;if(win===k)g.gw++;if(ga===0)g.gso++;});
  }
  [0,1].forEach(k=>{const f=T(tm[k]).form;f.push(win===k?1:0);if(f.length>10)f.shift();});
  [0,1].forEach(k=>{injRoll(teamCtx(tm[k],M)).forEach(([p,n])=>{L.ev.push({per:ri(1,3),s:ri(30,1150),ty:'inj',k,txt:`Травма: ${nm(p)} (${injSev(n)})`});});});
  L.ev.sort((a,b)=>a.per-b.per||a.s-b.s);
  const box=mkBox(L);
  S.box.unshift(box);S.box.length=Math.min(S.box.length,5);

}
function quickUser(h,a,kind){const L=newLive(h,a,kind);prep(L);runLive(L,null);return finishLive(L);}

  if(S.phase==='playoffs'){const up=userPO();if(!up||up.r!==S.po.round||up.s.wa>=4||up.s.wb>=4)return null;const s=up.s,homeA=[0,1,4,6].includes(s.wa+s.wb);return homeA?{h:s.a,a:s.b,kind:'po'}:{h:s.b,a:s.a,kind:'po'};}

const ROUNDS=['1-й раунд','2-й раунд','Финал конференции','Финал'];
function poDay(liveRes){
  if(S.phase!=='playoffs')return;
  const cur=S.po.rounds[S.po.round],C=ctx();
  cur.forEach(s=>{
    if(s.wa>=4||s.wb>=4)return;
    const homeA=[0,1,4,6].includes(s.wa+s.wb),mine=s.a===S.user||s.b===S.user;
    const h=homeA?s.a:s.b,a=homeA?s.b:s.a;
    const r=mine?(liveRes||quickUser(h,a,'po')):simGame(h,a,C,false);
    const aWon=homeA?r.gh>r.ga:r.ga>r.gh;aWon?s.wa++:s.wb++;
    styRec(h,r.yh,r.gh>r.ga);styRec(a,r.ya,r.ga>r.gh);
    if(r.h===S.user||r.a===S.user){userRes(r);finDay(r.h===S.user,true,C);}
    if(s.wa===4||s.wb===4){const w=s.wa===4?s.a:s.b,l=s.wa===4?s.b:s.a;if(w===S.user)news(`Серия выиграна у «${T(l).name}» ${Math.max(s.wa,s.wb)}:${Math.min(s.wa,s.wb)}.`);if(l===S.user)news(`Вылет: «${T(w).name}» сильнее в серии.`);}
  });
  bumpChem(C);healDay();
  if(cur.every(s=>s.wa===4||s.wb===4)){
    const win=cur.map(s=>s.wa===4?{id:s.a,seed:s.sa}:{id:s.b,seed:s.sb});
    if(win.length===1){S.po.champ=win[0].id;T(win[0].id).titles++;S.phase='done';news(`${T(win[0].id).city} «${T(win[0].id).name}» — чемпион сезона ${seasonLbl()}!`);growCap();return;}
    const next=[];
    for(let i=0;i<win.length;i+=2){let x=win[i],y=win[i+1];if(y.seed<x.seed||(y.seed===x.seed&&pts(T(y.id))>pts(T(x.id))))[x,y]=[y,x];next.push({a:x.id,b:y.id,sa:x.seed,sb:y.seed,wa:0,wb:0});}
    S.po.rounds.push(next);S.po.round++;
  }
}
function poOf(tid){if(!S.po)return null;for(let r=S.po.rounds.length-1;r>=0;r--){const s=S.po.rounds[r].find(s=>s.a===tid||s.b===tid);if(s)return {r,s};}return null;}

/* ---------- progression ---------- */
function teamSucc(tid){
  if(S.po&&S.po.champ===tid)return 1;
  const up=poOf(tid);if(up)return .25+.17*up.r;
  return pts(T(tid))/(2*DAYS)<.45?-.5:-.25;
}
function calcPerf(){
  const gr={F:[],D:[]};
  S.players.forEach(p=>{if(p.team>=0&&p.pos!=='G'&&p.gp>=20)gr[p.pos==='D'?'D':'F'].push(p);});
  const fit={};
  for(const k in gr){const a=gr[k],n=a.length;if(n<5){fit[k]=[.3,0];continue;}
    const ppg=p=>(p.g+p.a)/p.gp,mx=sum(a,p=>p.ovr)/n,my=sum(a,ppg)/n;let sxy=0,sxx=0;
    a.forEach(p=>{sxy+=(p.ovr-mx)*(ppg(p)-my);sxx+=(p.ovr-mx)**2;});const b=sxx?sxy/sxx:0;fit[k]=[my-b*mx,b];}
  const lg=sum(S.teams,t=>t.ga)/Math.max(1,sum(S.teams,gp));
  S.players.forEach(p=>{
    p.perf=0;if(p.team<0||p.gp<20)return;
    if(p.pos==='G'){const t=T(p.team),ga=t.ga/Math.max(1,gp(t));p.perf=clamp((lg-ga)/lg*3,-1,1);return;}
    const [a,b]=fit[p.pos==='D'?'D':'F'],e=Math.max(.08,a+b*p.ovr);
    p.perf=clamp(((p.g+p.a)/p.gp-e)/Math.max(.15,e),-1,1);
  });
}
const growRate=a=>a<=20?.38:a<=23?.3:a<=26?.2:.1;
function iceShare(p){
  if(p.team===-3)return .8;
  if(p.team<0)return .45;
  const tg=gp(T(p.team));
  if(S.phase!=='regular'){const s=p.gp/DAYS;return s>=.4?1:s>=.15?.7:.45;}
  if(tg<5)return lineIds(getLines(p.team)).includes(p.id)?1:.45;
  const s=p.gp/tg;return s>=.4?1:s>=.15?.7:.45;
}
const trainLvl=p=>p.team===S.user?S.fin.train-1:1;
const accM=p=>p.acc>0?1.5:1;
function develop(p,succ){
  p.age++;const a=p.age,tl=trainLvl(p),before=p.ovr;
  let ice=iceShare(p);if(p.acc>0)ice=Math.max(ice,.8);
  if(a<=28){
    const g=(p.pot-p.ovr)*growRate(a)*accM(p)*ice+p.perf*1.2+succ+.35*tl+gauss()*.8;
    const d=Math.round(g);
    p.ovr=d>0?Math.min(p.pot,p.ovr+d):p.ovr+Math.max(d,-2);
    if(a<=25&&p.perf>.4)p.pot=Math.min(97,p.pot+ri(1,2));
    if(a<=25&&p.perf<-.6)p.pot=Math.max(p.ovr,p.pot-1);
    if(a>=27)p.pot=Math.min(p.pot,p.ovr+2);
  }else if(a<=32){
    p.ovr+=clamp(Math.round(p.perf*.8+succ*.5+.15*(tl-1)-.1+gauss()*.6),-1,1);
    p.pot=Math.max(p.ovr,Math.min(p.pot,p.ovr+1));
  }else{
    const d=-(a-32)+p.perf+succ*.5+.25*tl+gauss()*.7;
    p.ovr+=Math.min(0,Math.round(d));p.pot=p.ovr;
  }
  if(p.acc>0)p.acc--;
  p.ovr=clamp(p.ovr,35,97);p.pot=Math.max(p.pot,p.ovr);p.lastD=p.ovr-before;
}
function forecast(p){
  const a=p.age+1,tl=trainLvl(p),t=p.team>=0?T(p.team):null;
  const sc=S.phase==='regular'&&t&&gp(t)?pts(t)/(2*gp(t))-.5:0;
  let ice=iceShare(p);if(p.acc>0)ice=Math.max(ice,.8);
  if(a<=28){const g=(p.pot-p.ovr)*growRate(a)*accM(p)*ice+.35*tl+sc,room=p.pot-p.ovr;return [clamp(Math.round(g-1.5),-2,room),clamp(Math.round(g+1.5),0,room)];}

  const d=-(a-32)+.25*tl;return [Math.round(d-1.5),Math.min(0,Math.round(d+1.5))];
}

function growCap(){const old=S.cap;S.cap=Math.round(S.cap*(1+CAP_GROW)/100)*100;news(`Потолок зарплат на следующий сезон: ${money(S.cap)} (+${money(S.cap-old)}). Запросы игроков выросли вместе с ним.`);}
function ownerEval(){

  if(fired){S.fired=true;track('fired',{s:S.season});news(`Ультиматум не выполнен. Владелец расстался с вами (${F.owner}/100).`);}
  else if(ultNow)news(`Ультиматум владельца: в следующем сезоне цель обязательна, иначе увольнение.`);
  else if(ultLift)news('Владелец снял ультиматум: цель сезона выполнена.');

function gmReview(){
  const rk=S.teams.slice().sort(cmpStand).map(t=>t.id);
  S.teams.forEach(x=>{
    if(x.id===S.user)return;
    const inPO=!!poOf(x.id),rank=rk.indexOf(x.id)+1;
    let fail;
    switch(x.own){
      case 'build':fail=rank>=x.lastRank&&rank>12;break;
      case 'acct':fail=!inPO&&payroll(x.id)>S.cap*.85;break;
      default:fail=!inPO;
    }
    x.fail=S.po.champ===x.id?0:fail?(x.fail||0)+1:0;x.lastRank=rank;
    if(x.fail>=OWN[x.own].lim){
      const old=x.own,W=GMK.filter(k=>k!==old).map(k=>[k,rank>20?({build:2,acct:1.5}[k]||1):rank<=10?({olig:2,show:1.5,prag:1.5}[k]||1):1]);
      x.own=pickW(W);x.fail=0;x.shake=true;
      news(`${x.city}: ГМ «${OWN[old].n}» уволен после неудачных сезонов. Новый ГМ — «${OWN[x.own].n}», ждём перестановок.`);
    }

}

/* ---------- user moves ---------- */
const canMarket=()=>S.phase==='offseason'||(S.phase==='regular'&&S.day<DEADLINE);
const maxY=p=>p.exp?8:7;
function termAdj(p,yrs){
  const d=yrs-p.askY,a=p.age;
  if(a<=27)return {f:1+.025*Math.max(0,d),pen:.04*Math.max(0,-d)+.015*Math.max(0,d)};
  if(a>=31)return {f:Math.max(.85,1-.03*Math.max(0,d))+.04*Math.max(0,-d),pen:.015*Math.abs(d)};
  return {f:1,pen:.04*Math.abs(d)};
}
const reqFor=(p,yrs)=>rs(askFor(p)*termAdj(p,yrs).f);
function patOf(p){if(p.patW!==S.win){p.pat=100;p.tries=0;p.patW=S.win;p.agentW=null;}return p.pat;}
const locked=p=>patOf(p)<=0;
function chance(p,sal,yrs){
  const t=termAdj(p,yrs);let c=(sal/rs(askFor(p)*t.f)-.84-t.pen)/.18;
  if(p.exp)c+=.12;if(p.agentW===S.win)c+=.05;
  return clamp(c,0,1);
}
function patDrop(p,sal,yrs){const gap=Math.max(0,1-sal/reqFor(p,yrs));return Math.round(clamp(8+gap*170,8,60)*(1+.3*(p.tries||0)));}
const agentCost=p=>rs(askFor(p)*.07);

  const c=agentCost(p);if(S.fin.cash<c)return toast(`Не хватает денег: нужно ${money(c)}.`);
  spend(c,'misc');p.agentW=S.win;p.pat=Math.min(100,p.pat+30);
  toast(`Агент ${nm(p)} получил ${money(c)}: +30 к терпению, +5% к шансу.`);
}
const ltirFree=()=>S.phase==='regular'?active(S.user).filter(p=>p.ltir&&!S.players.some(q=>q.temp===p.id)):[];
function sendOffer(){

  if(payroll(S.user)+o.sal>S.cap)return toast('Контракт не помещается под потолок.');

    p.team=S.user;p.sal=o.sal;p.yrs=yrs;p.exp=false;p.faY=0;if(o.temp)p.temp=o.temp;uniqName(p,S.user);
    news(`${isNew?'Подписали':'Продлили'} ${full(p)}: ${money(o.sal)} × ${yrs} ${yw(yrs)}${o.temp?` (временно, вместо ${nm(P(o.temp))})`:''}.`);
    U.sheet=null;U.offer=null;toast(`${full(p)} согласен!`);sfx('sign');
  }else{

  const aiN=active(tid).length+give.length-get.length;
  if(aiN>28)issues.push('У них переполнен состав.');
  if(aiN<18)issues.push('Им не хватит игроков.');
  const myN=rcount(S.user)-give.length+get.length;
  if(myN>MAX_ROSTER&&S.phase!=='offseason')issues.push(`У вас станет ${myN} игроков, максимум ${MAX_ROSTER}.`);
  if(gCount(tid)-get.filter(p=>p.pos==='G').length+give.filter(p=>p.pos==='G').length<2)issues.push('Им нужны два вратаря.');
  if(give.some(p=>p.temp))issues.push('Игроков с временным контрактом обменивать нельзя.');
  const req=own==='prag'?1:own==='trade'?.97:1.05,scale=Math.max(60,vOut),margin=vIn-vOut*req-10;
  return {vIn,vOut,salIn,salOut,myPay,issues,margin,pct:clamp(.5+margin/(2*scale),0,1),close:margin>-.15*scale,deal:margin>=0&&!issues.length};
}
function sendTrade(){
  const e=tradeEval();if(!e||e.empty)return;
  if(e.issues.length)return toast(e.issues[0]);
  if(!e.deal)return toast(`«${T(U.trade.tid).name}» отклонили предложение.`);
  const tr=U.trade,tid=tr.tid,give=tr.give.map(P),get=tr.get.map(P),giveP=tr.giveP.map(PK),getP=tr.getP.map(PK);
  give.forEach(p=>p.team=tid);get.forEach(p=>{p.team=S.user;uniqName(p,S.user);});giveP.forEach(k=>k.own=tid);getP.forEach(k=>k.own=S.user);
  const L=(ps,ks)=>[...ps.map(nm),...ks.map(pickLbl)].join(', ')||'ничего';
  news(`Обмен с ${T(tid).ab}: отдали ${L(give,giveP)}, получили ${L(get,getP)}.`);
  S.offers=S.offers.filter(o=>!offerIssue(o));
  resetTrade(tid);toast('Сделка закрыта!');sfx('sign');
}

function noiseBuf(ac){if(_nb)return _nb;const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return _nb=b;}
function env(g,t,a,h,r,v){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+a+h);g.gain.exponentialRampToValueAtTime(.0001,t+a+h+r);}
function burst(out,t,len,v,type,f,q){
  const ac=AC,n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  n.buffer=noiseBuf(ac);fl.type=type;fl.frequency.value=f;fl.Q.value=q;n.connect(fl);fl.connect(g);g.connect(out);

function blip(out,t,f0,f1,len,v,type){

}
function brass(out,f,t,dur,v){
  const ac=AC;[1,1.004].forEach(dt=>{
    const o=ac.createOscillator(),lp=ac.createBiquadFilter(),g=ac.createGain();
    o.type='sawtooth';o.frequency.value=f*dt;lp.type='lowpass';
    lp.frequency.setValueAtTime(600,t);lp.frequency.linearRampToValueAtTime(2600,t+.06);lp.frequency.exponentialRampToValueAtTime(1200,t+dur);
    o.connect(lp);lp.connect(g);g.connect(out);env(g,t,.03,dur*.7,dur*.5,v);o.start(t);o.stop(t+dur*1.3+.05);
  });
}
function soft(out,t,a,len,v,type,f,q){
  const ac=AC,n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  n.buffer=noiseBuf(ac);fl.type=type;fl.frequency.value=f;fl.Q.value=q;n.connect(fl);fl.connect(g);g.connect(out);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+len);n.start(t,Math.random()*1.5);n.stop(t+a+len+.02);

function applause(out,t,dur,dens,v){
  const n=Math.round(dur*dens);
  for(let i=0;i<n;i++){const x=i/n,tt=t+x*dur+Math.random()*.03,amp=v*(x<.15?x/.15:1-(x-.15)/.85*.9);

}
function sfx(k){
  if(!SND.on)return;const ac=audio();if(!ac)return;
  const t=ac.currentTime+.02,out=ac.createGain();out.gain.value=.6;out.connect(ac.destination);
  if(k==='goal'){
    const C=261.6,E=329.6,G=392,C2=523.3;
    [[G,0,.14],[G,.16,.14],[G,.32,.14],[C2,.48,.6]].forEach(([f,o,d])=>brass(out,f,t+o,d,.07));
    [[E,.48,.6],[C,.48,.6]].forEach(([f,o,d])=>brass(out,f,t+o,d,.05));
    applause(out,t+.2,2.4,55,.22);
  }else if(k==='whistle'){
    const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
    o.type='sine';o.frequency.value=2950;l.frequency.value=32;lg.gain.value=120;l.connect(lg);lg.connect(o.frequency);o.connect(g);g.connect(out);
    env(g,t,.015,.45,.12,.12);o.start(t);l.start(t);o.stop(t+.7);l.stop(t+.7);
  }else if(k==='shot'){
    out.gain.value=.35;
    soft(out,t,.004,.05,.22,'bandpass',1250,1.6);
    soft(out,t,.003,.035,.12,'bandpass',2600,2.5);
    blip(out,t,320,190,.06,.07,'triangle');
  }else if(k==='save'){
    out.gain.value=.35;
    soft(out,t,.006,.09,.25,'lowpass',520,.7);
    blip(out,t,120,70,.1,.12,'sine');
  }else if(k==='post'){
    out.gain.value=.3;
    [[1180,1.1,.07],[2720,.7,.04],[3950,.45,.025],[5300,.3,.015]].forEach(([f,d,v])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(out);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05);});
    soft(out,t,.002,.03,.12,'highpass',3000,.7);
    applause(out,t+.15,.9,10,.05);
  }else if(k==='sign'||k==='win'){
    [[523.3,0],[659.3,.09],[784,.18],[1046.5,.27]].forEach(([f,o])=>brass(out,f,t+o,.22,k==='win'?.05:.035));
    if(k==='win')applause(out,t+.15,1.8,40,.18);
  }else if(k==='loss'){
    [[392,0],[349.2,.16],[293.7,.32]].forEach(([f,o])=>blip(out,t+o,f,f*.99,.45,.06,'triangle'));

}

const PROG=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
function musBar(m,t){
  const ac=AC,ch=PROG[m.bar%PROG.length],bl=m.bl;
  ch.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(m.lp);env(g,t,.9,bl-1.6,1.4,.05);o.start(t);o.stop(t+bl+.5);});

  const pat=[0,1,2,1,0,2,1,2],step=bl/8;
  pat.forEach((k,i)=>{if(m.bar%4===3&&i>5)return;const f=ch[k]*2*(i===4?2:1),o=ac.createOscillator(),g=ac.createGain(),s=t+i*step;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(m.out);g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(.03,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+step*1.8);o.start(s);o.stop(s+step*2);});
  m.bar++;
}
function ambStart(){
  if(!SND.amb||!SND.on||MUS)return;const ac=audio();if(!ac)return;
  const out=ac.createGain(),lp=ac.createBiquadFilter();out.gain.value=0;lp.type='lowpass';lp.frequency.value=1100;lp.connect(out);out.connect(ac.destination);
  out.gain.linearRampToValueAtTime(.9,ac.currentTime+2);
  const m={out,lp,bar:0,bl:3.2,next:ac.currentTime+.1};
  m.iv=setInterval(()=>{while(m.next<AC.currentTime+1.2){musBar(m,m.next);m.next+=m.bl;}},400);
  MUS=m;
}
function ambStop(){
  if(!MUS)return;const m=MUS;MUS=null;clearInterval(m.iv);
  try{m.out.gain.cancelScheduledValues(AC.currentTime);m.out.gain.setValueAtTime(m.out.gain.value,AC.currentTime);m.out.gain.linearRampToValueAtTime(0,AC.currentTime+1);setTimeout(()=>{try{m.out.disconnect();}catch(e){}},1200);}catch(e){}

function finChart(){

  const mx=Math.max(1,...B.map(b=>Math.max(b.i,b.e)));
  const cmin=Math.min(0,...B.map(b=>b.c)),cmax=Math.max(1,...B.map(b=>b.c));
  const cy=v=>top+(1-(v-cmin)/(cmax-cmin||1))*(bot-top);
  const bars=B.map((b,k)=>{const x=34+k*bw,hi=(b.i/mx)*(mid-top-4),he=(b.e/mx)*(bot-mid-4);return `<rect x="${x+bw*.15}" y="${mid-hi}" width="${bw*.7}" height="${hi}" class="ch-in"/><rect x="${x+bw*.15}" y="${mid}" width="${bw*.7}" height="${he}" class="ch-ex"/>${b.po?`<rect x="${x}" y="${top}" width="${bw}" height="${bot-top}" class="ch-po"/>`:''}`;}).join('');
  const line=B.map((b,k)=>`${k?'L':'M'}${(34+k*bw+bw/2).toFixed(1)} ${cy(b.c).toFixed(1)}`).join(' ');
  const last=B[B.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Доходы и расходы по ходу сезона">
  <line x1="30" y1="${mid}" x2="${W-4}" y2="${mid}" class="ch-ax"/>

function boxView(b,live){
  const h=T(b.h),a=T(b.a),np=b.ot?4:3,cols=[...Array(np)].map((_,i)=>i<3?i+1:'ОТ');
  const rowT=(arr,k,t)=>`<tr><td class="tm">${tl(t,26)}</td>${arr.slice(0,np).map(x=>`<td>${x[k]}</td>`).join('')}<td class="pts">${sum(arr.slice(0,np),x=>x[k])}</td></tr>`;
  const tbl=(lbl,arr)=>`<div class="tbl-wrap"><table class="bx"><thead><tr><th>${lbl}</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Итого</th></tr></thead><tbody>${rowT(arr,0,h)}${rowT(arr,1,a)}</tbody></table></div>`;
  const shots=[0,1].map(k=>sum(b.psh,x=>x[k])),svp=k=>{const g=b.gk[k];return g.sa?((g.sa-g.ga)/g.sa).toFixed(3).replace(/^0/,''):'—';};
  const zt=b.zt[0]+b.zt[1]||1;
  const cmp=(lbl,hv,av,hn,an)=>{const t=(hn+an)||1;return `<div class="cmp"><b>${hv}</b><span>${lbl}</span><b>${av}</b><div class="cmpbar"><i style="width:${hn/t*100}%"></i><i style="width:${an/t*100}%"></i></div></div>`;};
  const plT=(k,t)=>`<div class="tbl-wrap"><table class="bx pl"><thead><tr><th>${tl(t,24)}</th><th>Г</th><th>П</th><th>Бр</th><th>±</th><th>Шт</th><th>Вр</th></tr></thead><tbody>${b.pl[k].map(p=>`<tr><td class="tm">${POS[p.pos]} ${p.n}</td><td>${p.g||''}</td><td>${p.a||''}</td><td>${p.sh||''}</td><td class="${p.pm>0?'ok':p.pm<0?'bad':''}">${p.pm>0?'+':''}${p.pm||''}</td><td>${p.pim||''}</td><td>${mmss(p.toi*20)}</td></tr>`).join('')}
  <tr><td class="tm">В ${b.gk[k].n}</td><td colspan="6" style="text-align:left">${b.gk[k].sa-b.gk[k].ga} сейвов из ${b.gk[k].sa}</td></tr></tbody></table></div>`;
  return `${live?'':`<div class="bx-head">${badge(h,64)}<div><b class="num">${b.sc[0]}:${b.sc[1]}</b><small>${b.so?'по буллитам':b.ot?'в овертайме':'основное время'} · ${b.d}</small></div>${badge(a,64)}</div>`}
  <section class="card"><h2>Голы</h2>${tbl('',b.pg)}<h2>Броски</h2>${tbl('',b.psh)}</section>
  <section class="card"><div class="cmp-h">${tl(h,30)}<span class="small muted">синий — ${h.city}, жёлтый — ${a.city}</span>${tl(a,30)}</div>
  ${cmp('Броски',shots[0],shots[1],shots[0],shots[1])}
  ${cmp('% отражённых',svp(0),svp(1),b.gk[0].sa-b.gk[0].ga,b.gk[1].sa-b.gk[1].ga)}
  ${cmp('Большинство',`${b.ppg[0]}/${b.ppo[0]}`,`${b.ppg[1]}/${b.ppo[1]}`,b.ppg[0]+.01,b.ppg[1]+.01)}
  ${cmp('Штрафные минуты',b.pim[0],b.pim[1],b.pim[0],b.pim[1])}
  ${cmp('Время в зоне атаки',Math.round(b.zt[0]/zt*100)+'%',Math.round(b.zt[1]/zt*100)+'%',b.zt[0],b.zt[1])}
  ${cmp('Тактика',b.tac[0],b.tac[1],b.tac[0],b.tac[1])}</section>
  ${live?'':`<section class="card"><h2>Ход матча</h2>${feedHTML(b.ev,b.h,b.a)}</section>`}
  <section class="card"><h2>Игроки</h2>${plT(0,h)}${plT(1,a)}<p class="small muted">Бр — броски, ± — плюс-минус в равных составах, Шт — штрафные минуты, Вр — время на льду.</p></section>`;
}
function protocolsCard(){
  if(!S.box.length)return '';
  return `<section class="card"><h2>Протоколы матчей<span>последние ${S.box.length}</span></h2><div class="list">${S.box.map((b,i)=>{const me=b.h===S.user?0:1,w=b.sc[me]>b.sc[1-me],o=T(me?b.h:b.a);
    return `<button class="prow" style="grid-template-columns:34px 1fr auto" data-a="box" data-id="${i}"><span class="res ${w?'w':'l'}" style="text-align:center">${w?'В':'П'}</span><span class="pn"><b>${me?'в гостях у':'дома с'} ${o.city}</b><small>${b.d} · броски ${sum(b.psh,x=>x[me])}:${sum(b.psh,x=>x[1-me])}</small></span><span class="money"><b>${b.sc[0]}:${b.sc[1]}${b.so?' Б':b.ot?' ОТ':''}</b><small>протокол</small></span></button>`;}).join('')}</div></section>`;
}

/* ---------- league tables ---------- */
const heat=(v,lo,hi)=>`style="background:linear-gradient(90deg,var(--heat) ${clamp(hi>lo?(v-lo)/(hi-lo):1,0,1)*100}%,transparent 0)"`;
const medal=i=>i<3?`<span class="md m${i+1}">${i+1}</span>`:i+1;
function viewLeague(){
  const tabsL=[['table','Таблица'],['clubs','Клубы'],['pts','Очки'],['g','Голы'],['a','Передачи'],['gk','Вратари'],['st','Спецбригады'],['po','Плей-офф']];
  const seg=`<div class="chips">${tabsL.map(([k,n])=>`<button class="chip" data-a="lg" data-id="${k}" aria-pressed="${U.lg===k}">${n}</button>`).join('')}</div>`;
  const tmc=t=>`<button class="tmb" data-a="team" data-id="${t.id}">${tl(t,24)}</button>`;
  if(U.lg==='clubs'){
    const R_=allR();
    return seg+[0,1,2,3].map(d=>`<section class="card"><h2>${CONF[d<2?0:1]} · ${DIVS[d]}</h2><div class="tgrid">${S.teams.filter(t=>t.div===d).sort(cmpStand).map(t=>`<button class="tcard${t.id===S.user?' mine':''}" data-a="team" data-id="${t.id}">${badge(t,46)}<div><small>${t.city}</small><b>${t.name}</b><small class="num">${gp(t)?`${pts(t)} оч. · `:''}сила ${R_[t.id].t.toFixed(1)}</small></div></button>`).join('')}</div></section>`).join('');
  }
  if(U.lg==='table'){
    const rows=S.teams.filter(t=>t.conf===U.conf).sort(cmpStand),mx=Math.max(1,...rows.map(pts)),mn=Math.min(...rows.map(pts));
    return seg+`<div class="seg">${CONF.map((c,i)=>`<button data-a="conf" data-id="${i}" aria-pressed="${U.conf===i}">${c}</button>`).join('')}</div>
    <section class="card"><h2>${CONF[U.conf]} конференция<span>8 в плей-офф</span></h2><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Клуб</th><th>И</th><th>В</th><th>П</th><th>ПО</th><th>±</th><th>О</th></tr></thead><tbody>
    ${rows.map((x,i)=>{const df=x.gf-x.ga;return `<tr class="${x.id===S.user?'me':''} ${i===7?'cut':''}"><td>${i+1}</td><td class="tm"><button class="tmb" data-a="team" data-id="${x.id}">${badge(x,24)}${x.name}</button></td><td>${gp(x)}</td><td>${x.w}</td><td>${x.l}</td><td>${x.ot}</td><td class="${df>0?'ok':df<0?'bad':''}">${df>0?'+':''}${df}</td><td class="pts" ${heat(pts(x),mn,mx)}>${pts(x)}</td></tr>`;}).join('')}</tbody></table></div>
    <p class="small muted">Победа 2 очка, поражение в овертайме или по буллитам (ПО) 1 очко. Красная черта отделяет зону плей-офф.</p></section>`;
  }
  const sk=S.players.filter(p=>p.team>=0&&p.pos!=='G'&&p.gp>0);
  const ptab=(title,key,sorter,cols,note)=>{
    const top=sk.slice().sort(sorter).slice(0,20);if(!top.length)return seg+`<section class="card"><h2>${title}</h2><p class="muted">Статистика появится после первых матчей.</p></section>`;
    const mx=key(top[0]),mn=key(top[top.length-1]);
    return seg+`<section class="card"><h2>${title}<span>${seasonLbl()}</span></h2><div class="tbl-wrap"><table class="lt"><thead><tr><th>#</th><th>Игрок</th><th>Клуб</th>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>
    ${top.map((p,i)=>`<tr class="${p.team===S.user?'me':''}"><td>${medal(i)}</td><td class="tm">${linkBtn(p,nm(p))}</td><td class="tm">${tmc(T(p.team))}</td>${cols.map((c,ci)=>`<td ${ci===0?`class="pts" ${heat(key(p),mn,mx)}`:''}>${c[1](p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${note?`<p class="small muted">${note}</p>`:''}</section>`;
  };
  if(U.lg==='pts')return ptab('Бомбардиры',p=>p.g+p.a,(a,b)=>(b.g+b.a)-(a.g+a.a)||b.g-a.g,[['О',p=>p.g+p.a],['Г',p=>p.g],['П',p=>p.a],['И',p=>p.gp]]);
  if(U.lg==='g')return ptab('Снайперы',p=>p.g,(a,b)=>b.g-a.g||b.ppg-a.ppg,[['Г',p=>p.g],['ГБ',p=>p.ppg],['И',p=>p.gp],['Г/И',p=>(p.g/p.gp).toFixed(2)]],'ГБ — голы в большинстве.');
  if(U.lg==='a')return ptab('Ассистенты',p=>p.a,(a,b)=>b.a-a.a||b.g-a.g,[['П',p=>p.a],['О',p=>p.g+p.a],['И',p=>p.gp],['П/И',p=>(p.a/p.gp).toFixed(2)]]);
  if(U.lg==='gk'){
    const mg=Math.max(0,...S.teams.map(gp)),min=Math.max(3,Math.round(mg*.3));
    const gs=S.players.filter(p=>p.team>=0&&p.pos==='G'&&p.gp>=min&&p.gsa>0).map(p=>({p,sv:(p.gsa-p.gga)/p.gsa,gaa:p.gga/p.gp})).sort((a,b)=>b.sv-a.sv).slice(0,20);
    if(!gs.length)return seg+`<section class="card"><h2>Вратари</h2><p class="muted">Нужно минимум ${min} игр, чтобы попасть в таблицу.</p></section>`;
    const mx=gs[0].sv,mn=gs[gs.length-1].sv,gmx=Math.max(...gs.map(x=>x.gaa)),gmn=Math.min(...gs.map(x=>x.gaa));
    return seg+`<section class="card"><h2>Вратари<span>от ${min} игр</span></h2><div class="tbl-wrap"><table class="lt"><thead><tr><th>#</th><th>Вратарь</th><th>Клуб</th><th>%ОБ</th><th>КН</th><th>И</th><th>В</th><th>ПН</th></tr></thead><tbody>
    ${gs.map(({p,sv,gaa},i)=>`<tr class="${p.team===S.user?'me':''}"><td>${medal(i)}</td><td class="tm">${linkBtn(p,nm(p))}</td><td class="tm">${tmc(T(p.team))}</td><td class="pts" ${heat(sv,mn,mx)}>${sv.toFixed(3).replace(/^0/,'')}</td><td ${heat(gmx-gaa,0,gmx-gmn)}>${gaa.toFixed(2)}</td><td>${p.gp}</td><td>${p.gw}</td><td>${p.gso}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">%ОБ — процент отражённых бросков, КН — коэффициент надёжности (пропущено за игру), ПН — матчи на ноль.</p></section>`;
  }
  if(U.lg==='st'){
    const rows=S.teams.map(x=>({x,pp:x.ppo?x.ppg/x.ppo:0,pk:x.pko?(x.pko-x.ppga)/x.pko:0,pm:gp(x)?x.pim/gp(x):0})).sort((a,b)=>b.pp-a.pp);
    const r=k=>[Math.min(...rows.map(o=>o[k])),Math.max(...rows.map(o=>o[k]))],[a1,b1]=r('pp'),[a2,b2]=r('pk'),[a3,b3]=r('pm');
    return seg+`<section class="card"><h2>Спецбригады<span>регулярка</span></h2><div class="tbl-wrap"><table class="lt"><thead><tr><th>#</th><th>Клуб</th><th>Бол.%</th><th>Мен.%</th><th>Штр/И</th></tr></thead><tbody>
    ${rows.map(({x,pp,pk,pm},i)=>`<tr class="${x.id===S.user?'me':''}"><td>${medal(i)}</td><td class="tm"><button class="tmb" data-a="team" data-id="${x.id}">${badge(x,24)}${x.name}</button></td><td class="pts" ${heat(pp,a1,b1)}>${x.ppo?(pp*100).toFixed(1):'—'}</td><td ${heat(pk,a2,b2)}>${x.pko?(pk*100).toFixed(1):'—'}</td><td ${heat(b3-pm,0,b3-a3)}>${gp(x)?pm.toFixed(1):'—'}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Чем длиннее полоса, тем лучше показатель. Команды, чью оборону часто прижимают, удаляются чаще, а при оборонительной тактике фолят больше.</p></section>`;
  }
  if(!S.po)return seg+`<section class="card"><h2>Плей-офф</h2><p>Сетка появится после ${DAYS}-го дня регулярного сезона.</p></section>`;
  return seg+S.po.rounds.map((rd,i)=>`<section class="card"><h2>${ROUNDS[i]}</h2><div class="bracket">${rd.map(s=>{const done=s.wa===4||s.wb===4,ca=done?(s.wa===4?'win':'lose'):'',cb=done?(s.wb===4?'win':'lose'):'';
    return `<div class="ser"><span class="${ca}">${s.sa}. ${T(s.a).city} ${T(s.a).name}</span><span class="sc">${s.wa}</span><span class="${cb}">${s.sb}. ${T(s.b).city} ${T(s.b).name}</span><span class="sc">${s.wb}</span></div>`;}).join('')}</div></section>`).reverse().join('');
}
if(typeof document!=='undefined'&&document.getElementById){
  if(window.claude?.hot?.ready)window.claude.hot.ready(boot);
  else if(cloudable()){const app=document.getElementById('app');if(app)app.innerHTML='<p class="muted" style="padding:48px 16px;text-align:center">Загрузка…</p>';cloudPre().catch(()=>{}).finally(()=>boot({}));}
  else boot(window.claude?.hot?.data??{});
}
</script>
</body>
</html>
